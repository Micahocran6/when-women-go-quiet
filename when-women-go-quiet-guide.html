<style>
:root{

  --p1:#5B5BD6; --p1t:#EAEAFB;
  --p2:#0B7F73; --p2t:#DCF2EF;

  --p6:#357F32; --p6t:#E1F0DE;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

  --pc:var(--ink); --pt:#ECE8F7; --pi:#fff;
}
.part-1{--pc:var(--p1);--pt:var(--p1t);--pi:#fff}
.part-2{--pc:var(--p2);--pt:var(--p2t);--pi:#fff}
.part-3{--pc:var(--p3);--pt:var(--p3t);--pi:#fff}
.part-4{--pc:var(--p4);--pt:var(--p4t);--pi:var(--ink)}
.part-5{--pc:var(--p5);--pt:var(--p5t);--pi:#fff}
.part-6{--pc:var(--p6);--pt:var(--p6t);--pi:#fff}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.18;margin:0}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-row{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px}
.help-pill{background:var(--p5);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px}
.ribbon.slim{display:grid;grid-template-columns:repeat(6,1fr);height:6px}
.ribbon.slim .band{position:relative}

/* ribbon */
.band .fill{position:absolute;inset:0;background:var(--pc);filter:grayscale(var(--g,1));opacity:calc(.5 + .5*(1 - var(--g,1)));transition:filter .6s,opacity .6s;border-radius:inherit}
.ribbon.big{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:124px;margin:22px 0 14px}
.ribbon.big .band{position:relative;border:0;padding:0;background:none;border-radius:999px;overflow:hidden;color:var(--pi)}
.ribbon.big .band:nth-child(1){height:70px}
.ribbon.big .band:nth-child(2){height:96px}
.ribbon.big .band:nth-child(3){height:124px}
.ribbon.big .band:nth-child(4){height:84px}
.ribbon.big .band:nth-child(5){height:110px}
.ribbon.big .band:nth-child(6){height:76px}
.ribbon.big .lab{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--serif);font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

main{max-width:720px;margin:0 auto;padding:6px 16px 110px;outline:none}

/* hero */
.hero{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px 20px 22px;margin-top:14px}
.hero .sub{color:var(--ink-soft);margin-bottom:8px;font-size:15px}
.hero h1{font-size:clamp(2.3rem,11vw,3.6rem);letter-spacing:-.01em}
.hero .lead{margin:12px 0 0;font-size:1.05rem;color:var(--ink-soft);max-width:34em}
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prog-row .txt{font-size:14px;color:var(--ink-soft);flex:1}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}

/* buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;font-weight:600;text-decoration:none;text-align:center}
.btn.primary{background:var(--ink);color:#fff}
.btn.pc{background:var(--pc);color:var(--pi)}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.alert{background:var(--p5);color:#fff}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;text-align:left}
.chip[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--pi)}
.chip.sug{border-style:dashed;color:var(--ink-soft)}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.card h2{font-size:1.35rem;margin-bottom:10px}
.card h3{font-size:1.1rem;margin-bottom:6px}
.big-q{font-family:var(--serif);font-size:1.45rem;line-height:1.25;margin:14px 0;padding-left:14px;border-left:6px solid var(--p3)}
.callout{background:var(--pt);border-radius:14px;padding:12px 14px;margin:12px 0}
.callout p{margin:4px 0 0}
.alertbox{background:#FFF1EE;border:1.5px solid var(--p5);border-radius:16px;padding:14px 16px;margin:14px 0}
.alertbox p:last-child{margin-bottom:0}
.hint{color:var(--ink-soft);font-size:14px;margin:0 0 8px}
.note{color:var(--ink-soft);font-size:15px}
.page-h{font-size:2rem;margin:22px 0 6px}
.page-sub{color:var(--ink-soft);margin-bottom:14px}

/* check-in and flow */
.moods{display:flex;flex-wrap:wrap;gap:8px}
.reply{margin-top:12px}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.flow .chip{border-radius:14px}
.flow .chip b{font-family:var(--serif);margin-right:6px}

/* chapters */
.part-head{background:var(--pc);color:var(--pi);border-radius:20px;padding:16px 18px;margin:28px 0 8px}
.part-head h2{font-size:1.3rem}
.part-head p{margin:4px 0 0;font-size:14px;opacity:.95}
.chap{background:#fff;border:1px solid var(--line);border-left:7px solid var(--pc);border-radius:16px;margin:10px 0;overflow:hidden}
.chap-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 14px;text-align:left}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pc);color:var(--pi);display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.ttl-wrap{flex:1;min-width:0}
.ttl{display:block;font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.2}
.bar{display:block;height:5px;background:var(--pt);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pc);transition:width .3s}
.cnt{flex:none;font-size:13px;color:var(--ink-soft)}
.chap-body{padding:0 16px 16px}
.purpose{color:var(--ink-soft)}
.checks{margin:8px 0}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;min-height:44px}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--pc);display:grid;place-items:center;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--pc)}
.check[aria-checked="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--pi);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check[aria-checked="true"] .lbl2{color:var(--ink-soft)}

/* tools */
.toolcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:7px solid var(--pc);border-radius:16px;padding:14px 16px;margin:10px 0}
.toolcard h3{font-size:1.1rem}
.toolcard .meta{font-size:13px;color:var(--ink-soft);margin:2px 0 4px}
.toolcard .badge{display:inline-block;background:var(--pt);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}
.back{background:none;border:0;padding:12px 0;font-weight:600;min-height:44px}
.tool h1{font-size:1.9rem;margin:2px 0 6px}
.crumb{color:var(--ink-soft);font-size:14px;margin-bottom:6px}
.field{display:block;margin:20px 0}
.lbl{display:block;font-weight:600;margin-bottom:6px}
.fh{font-size:1.15rem;margin:26px 0 0;padding-top:12px;border-top:2px solid var(--pt)}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus{border-color:var(--pc);outline:none;box-shadow:0 0 0 3px var(--pt)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--pt);border-radius:999px;padding:6px 6px 6px 14px;font-size:14px}
.tag .x{border:0;background:#fff;border-radius:50%;width:26px;height:26px;line-height:1;font-size:16px}
.addrow{display:flex;gap:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--pc);height:32px}
.scale-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.scale-top .val{color:var(--ink-soft);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pairs{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.pair{display:grid;grid-template-columns:1fr 78px 78px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:0}
.pair.hd{font-size:13px;color:var(--ink-soft);background:var(--pt)}
.pair .chip{padding:6px 0;text-align:center;justify-content:center;min-height:38px}
.summary{margin:22px 0}
.sumbox{background:var(--pt);border-radius:16px;padding:14px 16px}
.sumbox h3{font-size:1.05rem;margin-bottom:8px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.srow .bar{margin:0;background:#fff}
.stamp{width:100%}
.tfoot{font-size:14px;color:var(--ink-soft);margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
.tfoot button{background:none;border:0;padding:0;text-decoration:underline;font-size:14px}
.preview{background:#fff;border:1.5px dashed var(--pc);border-radius:14px;padding:14px;min-height:64px;font-family:var(--serif);font-size:1.1rem;line-height:1.4;white-space:pre-wrap}
.preview.empty{color:var(--ink-soft);font-family:var(--sans);font-size:15px}

/* cycle tracker */
.moodrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;font-size:12px;min-height:60px}
.mood i{display:block;width:22px;height:22px;border-radius:50%;background:var(--mc)}
.mood[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.grid{display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.cell{aspect-ratio:1;border:0;border-radius:6px;background:var(--line);padding:0;min-height:0}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* 30 days */
.week{border-left:7px solid var(--pc)}
.days{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.day{width:42px;height:42px;border-radius:50%;border:2px solid var(--pc);background:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;padding:0}
.day[aria-pressed="true"]{background:var(--pc);color:var(--pi)}

/* help */
.steps{padding-left:22px;margin:8px 0}
.steps li{margin:8px 0}
ul.plain{padding-left:20px;margin:8px 0}
ul.plain li{margin:6px 0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:8px 2px 9px;font-size:11.5px;color:var(--ink-soft);min-height:56px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke-width:2.4}
.tab[aria-current="page"] .ic{background:var(--p1t);border-radius:99px;padding:3px 14px}
.tab .ic{padding:3px 14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:600px){.ribbon.big{height:150px}.ribbon.big .band:nth-child(n){height:auto}.ribbon.big .band:nth-child(1){height:90px}.ribbon.big .band:nth-child(2){height:120px}.ribbon.big .band:nth-child(3){height:150px}.ribbon.big .band:nth-child(4){height:104px}.ribbon.big .band:nth-child(5){height:136px}.ribbon.big .band:nth-child(6){height:96px}}
</style>

/* ---------- progress ---------- */
const chDone=c=>c.s.reduce((a,_,i)=>a+(S.read[c.n+'-'+i]?1:0),0);
const chProg=c=>chDone(c)/c.s.length;
const partProg=p=>{const cs=CH.filter(c=>c.p===p);return cs.reduce((a,c)=>a+chProg(c),0)/cs.length;};
const totalProg=()=>{const t=CH.reduce((a,c)=>a+c.s.length,0);return CH.reduce((a,c)=>a+chDone(c),0)/t;};
function updateRibbons(){
  PARTS.forEach(p=>{
    const g=1-Math.sqrt(Math.min(1,partProg(p.n)));
    document.querySelectorAll('.band[data-part="'+p.n+'"]').forEach(b=>b.style.setProperty('--g',g.toFixed(2)));
  });
  const pc=Math.round(totalProg()*100);
  document.querySelectorAll('.js-overall').forEach(e=>{e.textContent=pc+'% explored. Color returns as you read and reflect.';});
  document.querySelectorAll('.js-overall-bar').forEach(e=>{e.style.width=pc+'%';});
}

const view={tab:'guide',tool:null,chapter:null};
function go(tab,tool,chapter){
  view.tab=tab;view.tool=tool||null;view.chapter=chapter||null;
  render();
  if(chapter){const el=document.getElementById('ch'+chapter);if(el) el.scrollIntoView({block:'start'});}
  else window.scrollTo(0,0);
}

/* ---------- field renderers ---------- */
function fText(f,v,changed){
  const ta=h('textarea',{rows:String(f.rows||3),placeholder:f.ph||''});
  ta.value=v[f.id]||'';
  ta.addEventListener('input',()=>{v[f.id]=ta.value;changed();});
  return h('label',{class:'field'},h('span',{class:'lbl'},f.label),f.hint&&h('span',{class:'hint',style:'display:block'},f.hint),ta);
}
function fList(f,v,changed){
  const items=v[f.id]=v[f.id]||[];
  const root=h('div',{class:'field'});
  function draw(focus){
    root.replaceChildren(h('span',{class:'lbl'},f.label),f.hint&&h('p',{class:'hint'},f.hint));
    root.append(h('div',{class:'tags'},items.map((t,i)=>h('span',{class:'tag'},t,h('button',{class:'x','aria-label':'Remove '+t,onclick:()=>{items.splice(i,1);changed();draw(true);}},'×')))));
    const inp=h('input',{type:'text',placeholder:'Add one…',maxlength:'140','aria-label':'Add to '+f.label});
    const add=()=>{const t=inp.value.trim();if(!t) return;items.push(t);changed();draw(true);};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
    root.append(h('div',{class:'addrow'},inp,h('button',{class:'btn small pc',onclick:add},'Add')));
    if(f.suggest){
      const left=f.suggest.filter(s=>!items.includes(s));
      if(left.length) root.append(h('div',{class:'sugg'},left.map(s=>h('button',{class:'chip sug',onclick:()=>{items.push(s);changed();draw(false);}},'+ '+s))));
    }
    if(focus) inp.focus();
  }
  draw(false);
  return root;
}
function fPick(f,v,changed){
  const multi=f.multi!==false;
  if(multi&&!Array.isArray(v[f.id])) v[f.id]=[];

/* cycle tracker */

    root.append(h('span',{class:'lbl',style:'margin-top:16px'},'Where am I in my cycle?'),h('div',{class:'chips'},phBtns));
    const ta=h('textarea',{rows:'2',placeholder:'Symptoms, sleep, anything that stood out'});

    }

    // summary

      const rows=PH.filter(p=>by[p[0]]).map(p=>h('p',{style:'margin:4px 0'},p[1]+': average mood '+avg(by[p[0]]).toFixed(1)+' of 5 ('+by[p[0]].length+' '+(by[p[0]].length===1?'entry':'entries')+')'));

    for(let d=wk.days[0];d<=wk.days[1];d++){
      const b=h('button',{class:'day','aria-pressed':!!S.days[d],'aria-label':'Day '+d},String(d));
      b.addEventListener('click',()=>{if(S.days[d]) delete S.days[d];else S.days[d]=true;b.setAttribute('aria-pressed',String(!!S.days[d]));upd();save();});
      dots.push(b);
    }
    const tasks=wk.tasks.map((t,i)=>{
      const key='w'+wk.n+'-'+i;
      const b=h('button',{class:'check',role:'checkbox','aria-checked':!!S.wk[key]},h('span',{class:'box'}),h('span',null,t));
      b.addEventListener('click',()=>{if(S.wk[key]) delete S.wk[key];else S.wk[key]=true;b.setAttribute('aria-checked',String(!!S.wk[key]));save();});
      return b;
    });
    w.append(h('section',{class:'card week part-'+wk.part},
      h('h2',null,'Week '+wk.n+': '+wk.title),h('p',{class:'note'},wk.line),
      h('div',{class:'days',role:'group','aria-label':'Days in week '+wk.n},dots),
      h('h3',null,'This week’s focus'),h('div',{class:'checks'},tasks),
      h('div',{class:'row',style:'margin-top:14px'},wk.tools.map(id=>h('button',{class:'btn pc small',onclick:()=>go('tools',id)},TOOLS.find(t=>t.id===id).title)))));
  });
  upd();
  return w;
}
function helpView(){
  const w=h('div');
  w.append(h('h1',{class:'page-h'},'Help now'),h('p',{class:'page-sub'},'Calm, direct steps for a hard moment.'));
  w.append(h('section',{class:'alertbox'},
    h('h2',{style:'font-size:1.3rem;margin-bottom:8px'},'If you are in danger right now'),
    h('p',null,'If you might act on thoughts of suicide, or you can’t keep yourself safe, call your local emergency number now.'),
    h('p',null,'In the US, you can call or text 988 (Suicide & Crisis Lifeline) at any hour.'),
    h('div',{class:'row'},h('a',{class:'btn alert',href:'tel:988'},'Call 988'),h('a',{class:'btn ghost',href:'sms:988'},'Text 988'),h('a',{class:'btn ghost',href:'https://findahelpline.com',target:'_blank',rel:'noopener'},'Helplines worldwide'))));
  w.append(h('section',{class:'card'},h('h2',null,'In the moment'),
    h('ol',{class:'steps'},
      h('li',null,h('strong',null,'Don’t stay alone.'),' Go to, or call, someone who can be with you.'),
      h('li',null,h('strong',null,'Tell someone directly.'),' You could say: “I’m having thoughts of suicide and I need you with me right now.”'),
      h('li',null,h('strong',null,'Put distance between you and anything you could use to hurt yourself.'),' Ask someone to hold it or remove it.'),
      h('li',null,h('strong',null,'Avoid alcohol and recreational drugs.'),' They can make a crisis harder to get through.'),
      h('li',null,h('strong',null,'Go somewhere safe,'),' near other people, or to an emergency department.'),
      h('li',null,h('strong',null,'Get emergency medical help'),' if you have already hurt yourself or taken something.')),
    h('p',{class:'note',style:'margin:8px 0 0'},'Your current pain is not your entire future.')));
  w.append(h('section',{class:'card'},h('h2',null,'Pregnant or a new mother'),
    h('p',null,'Postpartum Support International HelpLine (US): 1-800-944-4773, call or text.'),
    h('p',null,'National Maternal Mental Health Hotline (US): 1-833-852-6262.'),
    h('p',{class:'note',style:'margin:0'},'Thoughts of harming yourself or your baby, hearing or seeing things others don’t, or feeling confused or cut off from reality need urgent help. Call your local emergency number.')));
  w.append(h('section',{class:'card'},h('h2',null,'Signs it’s time to talk to someone'),
    h('ul',{class:'plain'},
      h('li',null,'Low mood or loss of interest most days for two weeks or more'),
      h('li',null,'Changes in sleep, appetite, energy, or concentration'),
      h('li',null,'Feeling worthless, guilty, or hopeless'),
      h('li',null,'Pulling away from people'),
      h('li',null,'Using more alcohol or other substances to cope'),
      h('li',null,'Struggling to function at work or at home')),
    h('p',{style:'margin:8px 0 0'},'Any thought of suicide, even a passing one, deserves attention.'),
    h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn primary small',onclick:()=>go('tools','provider')},'Prepare for an appointment'),h('button',{class:'btn ghost small',onclick:()=>go('tools','safety')},'Build a safety plan'))));
  w.append(h('section',{class:'card'},h('h2',null,'If someone else is struggling'),
    h('ul',{class:'plain'},h('li',null,'Ask directly. Asking about suicide doesn’t put the idea in her head.'),h('li',null,'Listen without arguing or trying to fix it.'),h('li',null,'Stay with her, and help her reach crisis or emergency support.'),h('li',null,'Look after yourself afterward too.'))));
  const clear=h('div');
  const showClear=()=>{
    clear.replaceChildren(h('button',{class:'btn ghost small',onclick:()=>{
      clear.replaceChildren(h('p',{class:'hint'},'This erases every entry, checkbox, and tracker in this guide. It can’t be undone.'),
        h('div',{class:'row'},h('button',{class:'btn alert small',onclick:()=>{S=fresh();save();go('guide');}},'Yes, erase everything'),h('button',{class:'btn ghost small',onclick:showClear},'Cancel')));
    }},'Erase my entries'));
  };
  showClear();
  w.append(h('section',{class:'card'},h('h2',null,'Your entries'),h('p',{class:'note'},'What you write here is saved for you only, when your device allows it. Nothing is sent to anyone.'),clear));
  return w;
}

/* ---------- shell ---------- */
const ICONS={
  guide:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  chapters:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
  tools:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  plan:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  help:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M6.3 6.3l3.2 3.2M14.5 14.5l3.2 3.2M17.7 6.3l-3.2 3.2M9.5 14.5l-3.2 3.2"/>'
};
const TABS=[['guide','Guide'],['chapters','Chapters'],['tools','Tools'],['plan','30 days'],['help','Help']];
function buildChrome(){
  const tabs=$('#tabs');
  TABS.forEach(([k,l])=>{
    const b=h('button',{class:'tab','data-tab':k,onclick:()=>go(k)});
    b.innerHTML='<span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg></span><span>'+l+'</span>';
    tabs.append(b);
  });
  const slim=$('#slimRibbon');
  PARTS.forEach(p=>slim.append(h('span',{class:'band part-'+p.n,'data-part':p.n},h('span',{class:'fill'}))));
  $('#helpTop').addEventListener('click',()=>go('help'));
}
function render(){
  const m=$('#main');
  m.replaceChildren();
  let node;
  if(view.tab==='guide') node=homeView();
  else if(view.tab==='chapters') node=chaptersView();
  else if(view.tab==='tools') node=view.tool?toolView(view.tool):toolsIndex();
  else if(view.tab==='plan') node=planView();
  else node=helpView();
  m.append(node);
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===view.tab) b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  updateRibbons();
}
(async function init(){
  await load();
  buildChrome();
  render();
})();
})();
</script>
